
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone Computers | Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>TECHZONE COMPUTERS</h1>
    <p>We Would Love to Hear From You</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
</nav>

<section class="contact">
    <h2>Contact Us</h2>
    <p>Fill in the form below to send us a message.</p>

    <form id="contactForm">

        <label>Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name" required minlength="3">

        <label>Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number" required pattern="[0-9]{10}" title="Enter exactly 10 digits">

        <label>Subject:</label>
        <select id="subject" required>
            <option value="">Select a subject</option>
            <option value="Purchase">Computer Purchase</option>
            <option value="Enquiry">Product Enquiry</option>
            <option value="Support">Customer Support</option>
        </select>

        <label>Message:</label>
        <textarea id="message" placeholder="Write your message here" required minlength="10"></textarea>

        <button type="submit">Submit Message</button>

    </form>

    <p id="response"></p>
</section>

<footer>
    <p>&copy; 2026 TechZone Computers. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
<section class="map-section">
    <h2>Find Us</h2>
    <p>Visit TechZone Computers in Kampala, Uganda.</p>

    <iframe
        src="https://www.google.com/maps?q=Kampala%2C%20Uganda&output=embed"
        width="100%"
        height="350"
        style="border:0;"
        'allowfullscreen=""
        loading="lazy">
    </iframe>
</section>

</body>
</html>
